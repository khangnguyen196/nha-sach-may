# CI: typecheck, lint, Vitest, build ở mọi push / PR. e2e chỉ chạy khi bật biến repo RUN_E2E = true (Settings → Secrets
# and variables → Actions → Variables): e2e tạo user / đơn / sách test thật trên Supabase (dọn sau khi chạy) nên cần
# SUPABASE_SERVICE_ROLE_KEY; nên trỏ CI vào một project Supabase riêng cho test (docs/plans/owner-todo.md → Deploy).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build prerender catalog từ Supabase → cần URL + publishable key (được phép lộ ra client)
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: check
    if: ${{ vars.RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
