# data-check: chạy thử file SQL dữ liệu (supabase/data/**) trên Supabase local trong Docker, với đúng các sách file nhắc
# tới lấy từ production QUA REST CÔNG KHAI (khóa publishable, như build của ci.yml). Không project cloud nào bị ghi,
# không service role, không đọc file env. File ghi thật do chủ dự án chạy tay trong SQL Editor; job đỏ thì không đưa file.
#
# Quy ước tên (supabase/data/<đợt>/, xem README.md ở đó):
#   vong-N-sach-*.sql   file GHI (UPDATE theo id, dollar-quote $mota$, khối do $$ … raise $$ kiểm cả lô trước commit)
#   vong-N-kiem.sql     SELECT kiểm, chỉ đọc (chạy trước / sau trên production)
#   vong-N-hoan-tac.sql file hoàn tác, một file cho cả vòng N
# Workflow tự nhận file theo tên: thêm vòng mới không cần sửa workflow. *.sql khác tên, file kiểm / hoàn tác không có file
# ghi cùng vòng, hoặc 0 file ghi → đỏ (cả push lẫn chạy tay). Thư mục khác mo-ta-song-ngu (hoặc vòng khác 3 / 4) khai báo
# "-- data-check: cot-duoc-ghi = a, b" trong file ghi (xem scripts/ci/data-check.sh).
# File ghi đã chạy production ghi vào supabase/data/da-chay-production.txt ("<file ghi> <YYYY-MM-DD>"): push bỏ qua vòng có
# mọi file ghi trong danh sách (dữ liệu đã đổi, kiểm lại sẽ đỏ), vòng chỉ có một phần → đỏ; bỏ qua hết → 0 vòng, xanh, bảng
# tóm tắt ghi "0 vòng cần kiểm". Chạy tay một file trong danh sách vẫn kiểm, kèm cảnh báo.
#
# Mỗi vòng (scripts/ci/data-check.sh): (d) chữ trong file (NFC, ký tự ẩn, $mota$, khối do $$) → lấy production → chế độ
# theo TỪNG FILE ghi: CHƯA GHI (mọi dòng của file description_en null + cờ false) / ĐÃ GHI (mọi dòng của file cờ true),
# lẫn lộn trong một file → đỏ. File ghi khai báo "-- data-check: che-do = viet-lai" (thay mô tả đã có bằng bản viết mới):
# bỏ bước nhận chế độ theo cờ, cả vòng chạy đường CHƯA GHI.
#   CHƯA GHI: (e) sửa 1 ký tự mô tả gốc → file phải lỗi P0001, 0 dòng đổi; (a) lần 1 số dòng đổi = số câu UPDATE;
#             (c) cột ngoài danh sách được ghi giữ nguyên md5, số dòng mọi bảng không đổi; (b) lần 2 = 0 dòng;
#             (f) hoàn tác → về đúng bản chụp đầu → hoàn tác lần 2 = 0 dòng → ghi lại → lần 2 = 0.
#   ĐÃ GHI:   (a) lần 1 = 0 dòng; (b) lần 2 = 0 dòng; (f) hoàn tác → trạng thái trước ghi → hoàn tác lần 2 = 0 → (e) →
#             ghi lại (= số câu) → khớp bản chụp production đã nạp → lần 2 = 0.
#   (f) (và (e) của ĐÃ GHI) chạy ở mức vòng: chỉ khi có file hoàn tác, kiểm đủ file ghi của vòng và mọi file cùng chế độ;
#   không thì bỏ qua, ghi lý do (không đỏ). Vòng có file đã chạy production + file chưa chạy: mỗi file kiểm riêng.
# "Dòng đổi" đếm bằng so md5 từng dòng theo id trước / sau (không tin command tag). Log chỉ có id, tên cột, số đếm.
name: data-check

on:
  push:
    branches-ignore: [main]
    paths:
      - 'supabase/data/**'
      - '.github/workflows/data-check.yml'
      - 'scripts/ci/data-check*'
      - 'supabase/schema.sql'
      - 'supabase/seed*.sql'
  workflow_dispatch:
    inputs:
      file:
        description: 'File ghi dưới supabase/data/ (VD supabase/data/mo-ta-song-ngu/vong-3-sach-viet.sql); trống = mọi file ghi'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: data-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DB_CONTAINER: supabase_db_nha-sach-may
  # Như migration-check (đã chạy được với schema.sql + seed)
  SUPABASE_EXCLUDE: imgproxy,postgres-meta,supavisor,edge-runtime

jobs:
  data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Kiểm tên mọi *.sql dưới supabase/data/ + gom vòng (mỗi dòng của units.txt = một vòng). Tên sai, file kiểm / hoàn
      # tác mồ côi, 0 file ghi → đỏ ở đây, cả push lẫn chạy tay
      - name: 1. File ghi cần kiểm (gom theo vòng)
        env:
          # Qua env, không chèn thẳng vào script (chữ người nhập)
          INPUT_FILE: ${{ inputs.file }}
        run: bash scripts/ci/data-check.sh --plan "$RUNNER_TEMP/units.txt" "$INPUT_FILE"

      # Node như ci.yml / e2e.yml (data-check-text.mjs); không cài gói nào
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # Dựng từ schema.sql + seed (config.toml) của nhánh, như e2e. Lỗi hạ tầng của Docker (VD "bind port 54322 already in
      # use", gặp ở migration-check) → dừng stack rồi thử lại, tối đa 3 lần
      - name: 2. Supabase local (schema.sql + seed của nhánh)
        run: |
          for attempt in 1 2 3; do
            if supabase start -x "$SUPABASE_EXCLUDE"; then
              exit 0
            fi
            echo "::warning::supabase start lỗi (lần $attempt), dừng stack rồi thử lại"
            supabase stop --no-backup || true
            docker ps -a --format '{{.Names}} {{.Status}} {{.Ports}}' || true
            sleep 15
          done
          echo "::error::supabase start lỗi 3 lần"
          exit 1
      # Không có bước in log Docker của DB khi lỗi (khác migration-check): log Postgres có thể chép nguyên câu SQL kèm mô tả

      - name: 3. Chạy thử từng vòng
        env:
          # Chỉ 2 secret này (như build của ci.yml): URL + khóa publishable, được phép lộ ra client. data-check.sh tự từ
          # chối khóa không phải publishable / anon
          SUPABASE_PROD_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PROD_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_PROD_KEY" ]; then echo "::add-mask::$SUPABASE_PROD_KEY"; fi
          if [ -n "$SUPABASE_PROD_URL" ]; then echo "::add-mask::$SUPABASE_PROD_URL"; fi
          export RESULTS="$RUNNER_TEMP/data-check-results.md"
          {
            echo '## data-check'
            echo
            echo '| Vòng | Kiểm | Kết quả |'
            echo '|---|---|---|'
          } > "$RESULTS"
          failed=0
          while read -r -a unit; do
            # Một group cho cả vòng; data-check.sh không mở group con (GitHub không hỗ trợ group lồng nhau)
            echo "::group::${unit[*]}"
            # stdin = /dev/null: docker exec -i trong script không được nuốt các dòng còn lại của units.txt
            if ! bash scripts/ci/data-check.sh "${unit[@]}" < /dev/null; then
              failed=1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/units.txt"
          # Mọi vòng đã chạy production (bước 1 bỏ qua hết): bảng không để trống
          if [ ! -s "$RUNNER_TEMP/units.txt" ]; then
            echo '| (không) | vòng cần kiểm | 0 vòng cần kiểm (mọi vòng đã chạy production, xem bước 1) |' >> "$RESULTS"
          fi
          echo
          echo "===== Tóm tắt ====="
          cat "$RESULTS"
          cat "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" != 0 ]; then
            echo "::error::data-check: có vòng HỎNG (xem bảng tóm tắt)"
            exit 1
          fi
