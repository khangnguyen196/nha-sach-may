# e2e (Playwright) trên Supabase local: `supabase start` dựng DB trống từ schema.sql + seed (supabase/config.toml),
# scripts/e2e-seed.ts nạp 58 sách test, Playwright build + start app trỏ vào đó. Không dùng project cloud nào, không
# cần secret (khóa của Supabase local là khóa demo, lấy bằng `supabase status`; scripts/e2e-env.ts từ chối production).
# Tắt tạm: Settings → Secrets and variables → Actions → Variables → RUN_E2E = false.
name: e2e

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    if: ${{ vars.RUN_E2E != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ghim bản CLI → image Docker cố định giữa các lượt
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Supabase local
        run: supabase start -x imgproxy,postgres-meta,supavisor
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - id: seed
        name: Seed books
        run: npx tsx scripts/e2e-seed.ts
      # src/types/database.ts phải khớp kiểu sinh từ DB local (dựng từ schema.sql). Lệch → tải artifact database-types
      # (`gh run download <run> -n database-types`), chép vào src/types/database.ts, `npm run typecheck`, commit.
      # Sinh trước Playwright (Playwright không đổi schema). Sinh lỗi không chặn Playwright (bước Playwright chỉ cần seed
      # xong); upload + so ở cuối, chạy cả khi Playwright fail hoặc job bị hủy vì quá giờ (`always()`), nhưng chỉ khi sinh
      # thành công: file rỗng / dở dang không thành artifact, không bị so như "lệch kiểu" (docs/plans/sau-ux.md mục 3).
      - id: gen_types
        name: Generate DB types (local)
        run: supabase gen types typescript --local --schema public --schema graphql_public > "$RUNNER_TEMP/database.ts"
      - if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: npx playwright test
      - if: ${{ always() && steps.gen_types.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: ${{ runner.temp }}/database.ts
          retention-days: 7
      - if: ${{ always() && steps.gen_types.outcome == 'success' }}
        name: Check src/types/database.ts
        run: diff -u src/types/database.ts "$RUNNER_TEMP/database.ts"
      - if: ${{ failure() }}
        name: Supabase logs (auth, rest, storage)
        run: |
          for service in auth rest storage; do
            echo "::group::$service"
            docker logs --tail 200 "supabase_${service}_nha-sach-may" 2>&1 || true
            echo "::endgroup::"
          done
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
